project_id = "pullup"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322

# seed.sql is sample data for a hosted project's SQL editor (it expects an
# existing venue); local databases and CI start empty.
[db.seed]
enabled = false

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["pullup://", "http://localhost:8081", "http://localhost:3000/**"]
jwt_expiry = 3600

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false
